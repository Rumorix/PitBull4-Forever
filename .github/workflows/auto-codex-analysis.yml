name: Auto-queue Codex read-only analysis

on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# This workflow only queues the existing VM Codex worker via GitHub labels.
# It does not run Codex itself or authorize any fix, merge, or release.
jobs:
  new_issue:
    if: >-
      github.event_name == 'issues' &&
      !startsWith(github.event.issue.title, '[Tracking]') &&
      !startsWith(github.event.issue.title, '[Audit Index]') &&
      !contains(github.event.issue.title, '[TEST]') &&
      !contains(github.event.issue.labels.*.name, 'codex-analyze') &&
      !contains(github.event.issue.labels.*.name, 'codex-running') &&
      !contains(github.event.issue.labels.*.name, 'codex-analyzed') &&
      !contains(github.event.issue.labels.*.name, 'codex-fix') &&
      !contains(github.event.issue.labels.*.name, 'codex-fixing') &&
      !contains(github.event.issue.labels.*.name, 'codex-fix-ready')
    runs-on: ubuntu-latest
    steps:
      - name: Label new issue for Codex analysis
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          printf '%s\n' '{"labels":["codex-analyze"]}' |
            gh api --method POST --input - "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels" >/dev/null
          echo "Queued read-only Codex analysis for issue #${ISSUE_NUMBER}"

  gradual_backfill:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Backfill at most two old issues per repository each day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&sort=created&direction=asc")
          numbers=$(jq -r '
            [ .[]
              | select(.pull_request == null)
              | select((.title | startswith("[Tracking]")) | not)
              | select((.title | startswith("[Audit Index]")) | not)
              | select((.title | contains("[TEST]")) | not)
              | select(([.labels[].name] | any(. == "codex-analyze" or . == "codex-running" or . == "codex-analyzed" or . == "codex-fix" or . == "codex-fixing" or . == "codex-fix-ready")) | not)
            ] | .[:2] | .[].number
          ' <<< "$raw")
          if [ -z "$numbers" ]; then
            echo 'No unanalyzed open issues to backfill.'
            exit 0
          fi
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            printf '%s\n' '{"labels":["codex-analyze"]}' |
              gh api --method POST --input - "repos/${GITHUB_REPOSITORY}/issues/${issue}/labels" >/dev/null
            echo "Backfill queued #${issue}"
          done <<< "$numbers"
